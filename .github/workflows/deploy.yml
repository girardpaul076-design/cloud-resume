name: Free AWS Resume Deploy

on:
  push:
    branches:
      - main  # Triggers the upload automatically whenever you save changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2  # Points directly to your Ohio bucket

    - name: Sync to S3
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} --exclude ".git*" --exclude ".github*" --delete
