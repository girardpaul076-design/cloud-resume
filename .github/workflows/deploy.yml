name: Free AWS Resume Deploy with IaC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Deploy Serverless Infrastructure (IaC)
      uses: aws-actions/aws-cloudformation-github-deploy@v1
      with:
        name: cloud-resume-backend-stack
        template: template.yaml
        no-fail-on-empty-changeset: "1"
        capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND

    - name: Sync Frontend to S3
      run: |
        aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} --exclude ".git*" --exclude ".github*" --exclude "template.yaml" --delete
