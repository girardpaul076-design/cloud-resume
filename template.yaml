AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Paul Girard Cloud Resume Serverless Backend IaC

Globals:
  HttpApi:
    CorsConfiguration:
      AllowMethods:
        - GET
        - OPTIONS
      AllowHeaders:
        - Content-Type
      AllowOrigins:
        - '*' # This opens the browser security gate so your website can load the numbers!

Resources:
  # 1. DynamoDB Table Resource
  ResumeTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: cloud-resume-stats
      PrimaryKey:
        Name: id
        Type: String

  # 2. Lambda Function Resource with Native HTTP API Trigger
  ResumeCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resume-visitor-counter-iac
      Handler: index.lambda_handler
      Runtime: python3.12
      InlineCode: |
        import json
        import boto3

        dynamodb = boto3.resource('dynamodb')
        table = dynamodb.Table('cloud-resume-stats')

        def lambda_handler(event, context):
            response = table.update_item(
                Key={'id': 'visitors'},
                UpdateExpression='ADD #c :val',
                ExpressionAttributeNames={'#c': 'count'},
                ExpressionAttributeValues={':val': 1},
                ReturnValues='UPDATED_NEW'
            )
            
            # Format the output data precisely so your JavaScript can read data.count
            views_count = int(response['Attributes']['count'])
            
            return {
                'statusCode': 200,
                'headers': {
                    'Content-Type': 'application/json'
                },
                'body': json.dumps({'count': views_count})
            }
      Policies:
        - DynamoDBCrudPolicy:
            TableName: cloud-resume-stats
      Events:
        CounterApiEvent:
          Type: HttpApi
          Properties:
            Path: /resume-visitor-counter
            Method: get

Outputs:
  LiveCounterApiUrl:
    Description: "Copy this exact URL and paste it into your index.html file"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}://"



