AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Paul Girard Cloud Resume Serverless Backend & SIEM Architecture

Globals:
  HttpApi:
    CorsConfiguration:
      AllowMethods:
        - GET
        - OPTIONS
      AllowHeaders:
        - Content-Type
      AllowOrigins:
        - '*'

Parameters:
  IpHashSalt:
    Type: String
    Default: 'fallback-dev-salt-12345'
    Description: Secret salt for visitor IP hashing.
    NoEcho: true

Resources:
  # 1. DynamoDB Table for Visitor Counter
  ResumeTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: cloud-resume-stats
      PrimaryKey:
        Name: id
        Type: String

  # 2. DynamoDB Table for SIEM Metrics
  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SiemMetricsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # 3. Visitor Counter Function with Inline Telemetry Logging
  ResumeCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resume-visitor-counter-iac
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          IP_HASH_SALT: !Ref IpHashSalt
      InlineCode: |
        import json
        import hashlib
        import os
        import boto3
        from datetime import datetime, timezone

        dynamodb = boto3.resource('dynamodb')
        table = dynamodb.Table('cloud-resume-stats')
        IP_HASH_SALT = os.environ.get("IP_HASH_SALT", "fallback-dev-salt-12345")

        def lambda_handler(event, context):
            headers = {k.lower(): v for k, v in event.get("headers", {}).items()}
            http_ctx = event.get("requestContext", {}).get("http", {})
            
            raw_ip = http_ctx.get("sourceIp", "unknown")
            ip_hash = hashlib.sha256(f"{IP_HASH_SALT}:{raw_ip}".encode()).hexdigest()
            user_agent = headers.get("user-agent", "").lower()
            path = http_ctx.get("path", "/")
            method = http_ctx.get("method", "GET")
            timestamp = int(datetime.now(timezone.utc).timestamp() * 1000)

            response = table.update_item(
                Key={'id': 'visitors'},
                UpdateExpression='ADD #c :val',
                ExpressionAttributeNames={'#c': 'count'},
                ExpressionAttributeValues={':val': 1},
                ReturnValues='UPDATED_NEW'
            )
            
            views_count = int(response['Attributes']['count'])
            
            telemetry_payload = {
                "source": "cloud-resume-visitor-counter",
                "IpHash": ip_hash,
                "UserAgent": user_agent,
                "Path": path,
                "Method": method,
                "Timestamp": str(timestamp)
            }
            print(json.dumps(telemetry_payload))

            return {
                'statusCode': 200,
                'headers': {
                    'Content-Type': 'application/json',
                    'Access-Control-Allow-Origin': '*'
                },
                'body': json.dumps({'count': views_count})
            }
      Policies:
        - DynamoDBCrudPolicy:
            TableName: cloud-resume-stats
      Events:
        CounterApiEvent:
          Type: HttpApi
          Properties:
            Path: /resume-visitor-counter
            Method: get

  # 4. SIEM Processor Function (Inline Code - No CodeUri needed!)
  SecurityMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SecurityMonitorFunction
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 15
      Environment:
        Variables:
          METRICS_TABLE: !Ref MetricsTable
      InlineCode: |
        import os
        import json
        import base64
        import gzip
        import boto3

        dynamodb = boto3.resource("dynamodb")
        METRICS_TABLE_NAME = os.environ.get("METRICS_TABLE", "SiemMetricsTable")
        metrics_table = dynamodb.Table(METRICS_TABLE_NAME)

        def lambda_handler(event, context):
            compressed_payload = base64.b64decode(event['awslogs']['data'])
            uncompressed_data = gzip.decompress(compressed_payload)
            log_data = json.loads(uncompressed_data)

            recon_indicators = ["curl", "python-requests", "nikto", "sqlmap", "gobuster", "nmap", "masscan"]

            for log_event in log_data.get("logEvents", []):
                message = log_event.get("message", "")
                try:
                    if "cloud-resume-visitor-counter" in message:
                        data = json.loads(message)
                        user_agent = data.get("UserAgent", "").lower()
                        ip_hash = data.get("IpHash", "unknown")
                        timestamp = data.get("Timestamp", "0")
                        
                        is_suspicious = any(scanner in user_agent for scanner in recon_indicators)
                        metric_id = f"VISIT#{ip_hash}#{timestamp}"

                        metrics_table.put_item(
                            Item={
                                "id": metric_id,
                                "IpHash": ip_hash,
                                "UserAgent": user_agent,
                                "Path": data.get("Path", "/"),
                                "Method": data.get("Method", "GET"),
                                "IsSuspicious": is_suspicious,
                                "Timestamp": timestamp
                            }
                        )
                except Exception as e:
                    print(f"SIEM Error: {str(e)}")

            return {"statusCode": 200, "body": "Processed"}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable

  # 5. CloudWatch Subscription Filter
  SiemsLogSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ResumeCounterFunction}"
      FilterPattern: "cloud-resume-visitor-counter"
      DestinationArn: !GetAtt SecurityMonitorFunction.Arn

  SIEMInvokePermission:
    Type: AWS::Logs::LogGroup # Ensures log group exists for permissions
    Metadata:
      Comment: "Log Group for visitor counter"
    DependsOn: ResumeCounterFunction

  SIEMInvokePermissionLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SecurityMonitorFunction
      Principal: !Sub "logs.${AWS::Region}.amazonaws.com"
      SourceArn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/resume-visitor-counter-iac:*"

Outputs:
  LiveCounterApiUrl:
    Description: "Copy this exact URL and paste it into your index.html file"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
